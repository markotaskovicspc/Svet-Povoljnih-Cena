<!doctype html><html lang="sr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SPC · Razgovori</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f5f5f2;color:#17252b;font:15px system-ui}header{background:#143c34;color:white;padding:24px 32px}h1{margin:0;font-size:25px}header p{margin:8px 0 0;color:#c1d6ce}main{padding:24px;max-width:1200px;margin:auto}input,textarea,button{font:inherit;padding:11px;border:1px solid #ccc;border-radius:7px}button{cursor:pointer;background:white}button.primary{background:#155b48;color:white;border:0}#login{display:flex;gap:10px;margin-bottom:20px}#layout{display:grid;grid-template-columns:330px 1fr;gap:20px}.card{padding:20px;background:white;border:1px solid #ddd;border-radius:12px}#list button{display:block;width:100%;text-align:left;margin:8px 0;font-size:13px}#messages{min-height:250px;max-height:55vh;overflow:auto}.bubble{white-space:pre-wrap;padding:14px;background:#f0f4f1;border-radius:8px;margin:10px 0}.user{background:#edf1f6}.meta{font-size:12px;color:#666}textarea{width:100%;margin:12px 0}#status{color:#a03720;margin:14px 0}a{color:#145842}@media(max-width:700px){#layout{grid-template-columns:1fr}#login{flex-wrap:wrap}}</style>
<header><h1>SPC · Razgovori</h1><p>Facebook i Instagram — porudžbine i podrška</p></header><main><div id="login"><input id="token" type="password" placeholder="Pristupni ključ operatera" autocomplete="off"><button class="primary" id="connect">Otvori razgovore</button><button id="logout">Odjavi se</button></div><div id="status" role="status"></div><div id="layout"><section class="card"><b>Razgovori</b><button id="refresh">Osveži</button><div id="list"></div></section><section class="card"><b id="selected">Izaberite razgovor</b><p id="reason"></p><button id="pause">Preuzmi razgovor</button> <button id="resume">Vrati AI asistentu</button><div id="messages"></div><div id="attachments"></div><textarea id="reply" placeholder="Odgovor kupcu" maxlength="1800"></textarea><button class="primary" id="send">Pošalji odgovor</button><p class="meta">Ručno slanje pauzira AI. Poruke se šalju samo u dozvoljenom prozoru za odgovor.</p></section></div></main>
<script>
let token='',selected=null;const el=id=>document.getElementById(id);const status=text=>el('status').textContent=text;
async function api(path,body){const r=await fetch(path,{method:body?'POST':'GET',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});if(!r.ok)throw Error('Zahtev nije uspeo ('+r.status+'). Proverite pristup ili stanje servisa.');return r.json();}
async function load(){try{const rows=await api('/admin/conversations');el('list').replaceChildren();for(const row of rows){const b=document.createElement('button');b.textContent=(row.paused?'⏸ ':'● ')+row.channel+' · '+row.id.split(':').at(-1);b.onclick=()=>show(row);el('list').append(b);}status('');}catch(e){status(e.message);}}
async function show(row){try{selected=row.id;el('selected').textContent=row.channel+' · '+row.id.split(':').at(-1);el('reason').textContent=row.paused?'AI pauziran: '+(row.reason??''): 'AI aktivan';const data=await api('/admin/conversation?id='+encodeURIComponent(row.id));el('messages').replaceChildren();for(const m of data.history){const d=document.createElement('div');d.className='bubble '+(m.role==='user'?'user':'');d.textContent=(m.role==='user'?'Kupac: ':'SPC: ')+m.content;el('messages').append(d);}el('attachments').replaceChildren();for(const a of data.attachments){if(!a.url?.startsWith('https://'))continue;const link=document.createElement('a');link.textContent='Otvori prilog kupca';link.href=a.url;link.target='_blank';link.rel='noopener noreferrer';el('attachments').append(link,document.createElement('br'));}}catch(e){status(e.message);}}
async function action(action){if(!selected)return;try{await api('/admin/action',{id:selected,action,text:el('reply').value});el('reply').value='';status('Sačuvano.');await load();}catch(e){status(e.message);}}
el('connect').onclick=()=>{token=el('token').value;el('token').value='';load();};el('logout').onclick=()=>location.reload();el('refresh').onclick=load;el('pause').onclick=()=>action('pause');el('resume').onclick=()=>action('resume');el('send').onclick=()=>action('reply');
</script></html>
